name: Build packages

# PyInstaller cannot cross-compile, so the Windows package is built on a real
# Windows runner and the macOS app on a real macOS runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qt/requirements.txt pyinstaller

      - name: Prove the engine before packaging it
        run: |
          python tools/selfcheck.py
          python tools/command_sweep.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the application and the installer
        run: python packaging/build_installer.py --app

      - uses: actions/upload-artifact@v7
        with:
          name: RiftPDF-windows
          path: |
            dist/RiftPDF-*-Setup.exe
            dist/RiftPDF-*-portable.zip
            dist/SHA256SUMS.txt

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the Python engine environment
        run: ./setup.sh

      - name: Build the app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent RiftPDF.app RiftPDF-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RiftPDF-macos
          path: RiftPDF-macos.zip

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/**/*.exe
            packages/**/*.zip
            packages/**/SHA256SUMS.txt
          # Deliberately not generate_release_notes. Release notes here are
          # written by hand -- what changed, what was actually verified, what
          # SmartScreen will say -- and running this against a release that
          # already has them would replace that with a list of commit titles.
          # Attaching files to an existing release must not rewrite it.
