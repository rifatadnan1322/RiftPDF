name: Build packages

# PyInstaller cannot cross-compile, so the Windows package is built on a real
# Windows runner and the macOS app on a real macOS runner.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Nothing gets write access by default. The build jobs can only sign a
# statement about what they built; only the publish job can touch a release.
permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qt/requirements.txt pyinstaller

      - name: Prove the engine before packaging it
        run: |
          python tools/selfcheck.py
          python tools/command_sweep.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build the application and the installer
        run: python packaging/build_installer.py --app

      - name: Check the .exe says what it is
        # Properties > Details on an executable with no name, version or
        # licence looks like something hiding. Fail rather than ship that.
        shell: pwsh
        run: |
          $info = (Get-Item dist\RiftPDF\RiftPDF.exe).VersionInfo
          $info | Format-List ProductName, FileVersion, CompanyName, LegalCopyright
          if ($info.ProductName -ne "RiftPDF") { throw "RiftPDF.exe carries no version metadata" }

      - name: Record where these files came from
        # A signed statement, kept in a public log, that these exact files
        # were built by this workflow from this commit. Anyone can check a
        # download against it with `gh attestation verify`, so a file swapped
        # after the build -- or built anywhere else -- does not pass.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/RiftPDF-*-Setup.exe
            dist/RiftPDF-*-portable.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RiftPDF-windows
          path: |
            dist/RiftPDF-*-Setup.exe
            dist/RiftPDF-*-portable.zip

  macos:
    name: macOS app (${{ matrix.chip }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { chip: apple-silicon, runner: macos-latest }
          - { chip: intel, runner: macos-15-intel }
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Build the Python the engine runs on
        run: ./setup.sh

      - name: Build the app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent RiftPDF.app RiftPDF-macos-${{ matrix.chip }}.zip

      - name: Prove the package stands on its own
        # The app once shipped a Python that was only a link back to the one on
        # this runner, so it worked here and on nobody else's Mac. Unpack the
        # zip somewhere fresh, take away the copy it was built from, and make
        # the packaged engine do real work using only what is inside the app.
        run: |
          FRESH="$RUNNER_TEMP/fresh"
          mkdir -p "$FRESH"
          ditto -x -k RiftPDF-macos-${{ matrix.chip }}.zip "$FRESH"
          rm -rf engine/python RiftPDF.app
          APP="$FRESH/RiftPDF.app"
          ENGINE="$APP/Contents/Resources/engine"

          codesign --verify --deep --strict "$APP"

          # A link that leaves the bundle is exactly how this broke before.
          if find "$APP" -type l -exec readlink {} \; | grep '^/'; then
            echo "The app contains links to files outside itself."; exit 1
          fi
          if grep -rIl --include='*.cfg' --include='*.pth' -e "$HOME" -e /opt/homebrew -e /usr/local "$ENGINE/python"; then
            echo "The bundled Python refers to this machine."; exit 1
          fi

          cd "$FRESH"
          run() { env -i HOME="$HOME" PATH=/usr/bin:/bin TMPDIR="$TMPDIR" "$ENGINE/python/bin/python3" "$@"; }
          run "$ENGINE/riftpdf_engine.py" --selftest
          run -c "import sys; assert sys.prefix.startswith('$APP'), sys.prefix; print('running from', sys.prefix)"
          run "$GITHUB_WORKSPACE/tools/command_sweep.py"

      - name: Record where this file came from
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: RiftPDF-macos-${{ matrix.chip }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: RiftPDF-macos-${{ matrix.chip }}
          path: RiftPDF-macos-${{ matrix.chip }}.zip

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true

      - name: Checksums for every download
        # One list covering both platforms, written here from the files that
        # are about to be published rather than carried over from a build job.
        working-directory: packages
        run: |
          sha256sum *.exe *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attach packages to the release
        # Done with the GitHub CLI rather than a third-party action: this is
        # the one step holding a token that can change a release, and nobody
        # else's code should run with it.
        #
        # Release notes are written by hand -- what changed, what was actually
        # verified, what SmartScreen will say. Attaching files to a release
        # that already exists must not rewrite them, so an existing release
        # only receives the files.
        working-directory: packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" *.exe *.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" *.exe *.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "RiftPDF ${TAG#v}" \
              --notes "Release notes to follow. See docs/INSTALL.md for how to install and how to verify a download."
          fi
