name: Verify

# The engine had 43 commands that worked on the machine they were written on
# and had never been run anywhere else, and docs/WINDOWS.md spent a while
# describing a Windows build nobody had actually run. Checking that by hand
# finds real problems once and then rots. This runs on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qt/requirements.txt

      - name: What this runner can do
        # Printed whether or not anything fails, because "which optional tools
        # were present" is the first question asked about any failure here.
        run: python engine/riftpdf_engine.py --selftest

      - name: Compression, OCR and Word to PDF
        # Builds its own documents and proves the results, rather than only
        # checking that nothing raised.
        run: python tools/selfcheck.py

      - name: Every engine command
        run: python tools/command_sweep.py

  build:
    name: Windows package
    runs-on: windows-latest
    # No point packaging a build whose engine does not work.
    needs: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: qt/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qt/requirements.txt pyinstaller

      - name: Build the application
        run: python qt/build_windows.py

      - name: Ask the packaged build what it can do
        # A frozen bundle is the configuration users actually get, and it can
        # fail where the source tree does not -- winsdk's namespaces are
        # extension modules loaded at run time, so a missing --collect-all
        # would drop OCR here and nowhere else.
        run: |
          Start-Process .\dist\RiftPDF\RiftPDF.exe -ArgumentList "--command","selftest" -Wait -NoNewWindow
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          name: RiftPDF-windows-unpackaged
          path: dist/RiftPDF
          retention-days: 7

  macos:
    name: macOS engine
    runs-on: macos-latest
    # The engine is shared, so a change made for Windows can break the macOS
    # app without anyone noticing until a release is cut. This session changed
    # the engine substantially, and nothing was watching that side.
    steps:
      - uses: actions/checkout@v7

      - name: Build the engine environment
        run: ./setup.sh

      - name: Compression, OCR and Word to PDF
        run: engine/.venv/bin/python tools/selfcheck.py

      - name: Every engine command
        run: engine/.venv/bin/python tools/command_sweep.py
