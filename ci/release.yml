name: Build packages

# PyInstaller cannot cross-compile, so the Windows package is built on a real
# Windows runner and the macOS app on a real macOS runner.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r qt/requirements.txt pyinstaller

      - name: Sanity-check the engine
        run: python engine/riftpdf_engine.py --selftest

      - name: Build
        run: python qt/build_windows.py

      - name: Package
        run: Compress-Archive -Path dist/RiftPDF/* -DestinationPath RiftPDF-windows.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: RiftPDF-windows
          path: RiftPDF-windows.zip

  macos:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Python engine environment
        run: ./setup.sh

      - name: Build the app
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent RiftPDF.app RiftPDF-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: RiftPDF-macos
          path: RiftPDF-macos.zip

  release:
    name: Publish release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages

      - name: Attach packages to the release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/**/*.zip
          generate_release_notes: true
